[package]
name = "gis-napi"
version = "0.1.0"
edition = "2021"
description = "Node.js native addon for GIS layout engine via napi-rs"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "2"

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"

geometry-kernel-layout = { package = "layout-geometry-kernel", path = "../modelling/layout-geometry-kernel", features = ["native"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
