[package]
name = "layout-geometry-kernel"
version = "0.1.0"
edition = "2021"
description = "Private RegenWorks layout adapter backed by the published geometry-kernel crate"

[lib]
name = "geometry_kernel_layout"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
native = ["geometry-kernel"]
wasm = [
    "geometry-kernel",
    "wasm-bindgen",
    "console_error_panic_hook",
    "getrandom",
    "instant",
    "getrandom/js",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geometry-kernel = { version = "1.0.0", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
getrandom = { version = "0.2", optional = true }
instant = { version = "0.1", features = ["wasm-bindgen"], optional = true }

[dev-dependencies]
approx = "0.5"
