[package]
name = "gis-rs"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of RegenWorks layout modelling"

[dependencies]
# HTTP server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GeoJSON parsing
geojson = "0.24"

# Geometry operations (GEOS bindings)
geos = "10.0"

# Coordinate projections
proj = "0.27"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "gis-server"
path = "src/main.rs"

[lib]
name = "gis_rs"
path = "src/lib.rs"
