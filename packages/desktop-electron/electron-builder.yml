appId: com.regenfarmer.regenworks.desktop
productName: RegenWorks
artifactName: "${productName}-${version}-${arch}.${ext}"

directories:
  output: dist-electron

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.dll"
  - "**/*.dylib"

files:
  - dist/**
  - node_modules/**
  - package.json
  # texture-compressor ships a pre-built x86_64 PVRTexToolCLI that's linked
  # against a pre-10.9 SDK. It's a build-time tool only (converts textures to
  # PVR format), never loaded at runtime, but Apple notarization rejects the
  # archive if it's present. Exclude its bin folder entirely.
  - "!**/node_modules/texture-compressor/bin/**"

# Replace pnpm workspace symlinks with real copies before packaging
beforePack: scripts/before-pack.js

# Bundle dylibs and rewrite paths in the unpacked native modules
afterPack: scripts/after-pack.js

# Bundle the pre-built frontend SPA
extraResources:
  - from: ../frontend/dist
    to: client
    filter:
      - "**/*"

# macOS
mac:
  target:
    - dmg
    - zip
  icon: icons/icon.icns
  minimumSystemVersion: "10.15"
  category: public.app-category.productivity
  notarize: true

dmg:
  sign: false

protocols:
  - name: RegenWorks
    schemes:
      - regenworks

# Windows
win:
  target:
    - nsis
  icon: icons/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# Linux
linux:
  target:
    - AppImage
    - deb
  icon: icons/icon.png
  category: Office

# Auto-updater publishing (GitHub Releases on the distribution repo)
publish:
  provider: github
  owner: regen-farmer
  repo: regenworks-distribution
  private: false
