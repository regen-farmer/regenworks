packages:
  - packages/*
  # desktop-tauri is currently disabled while the frontend split lands.
  # Re-enable by removing the negation when ready.
  - "!packages/desktop-tauri"

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
  puppeteer: true
  sharp: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - electron

# Refuse packages published less than this many minutes ago (1440 = 1 day).
# Explicit so local, CI, and the Render deploy enforce the same supply-chain
# policy instead of relying on pnpm 11's silent default.
minimumReleaseAge: 1440

# @maptiler/sdk pins its own maplibre-gl; pin the direct dep to the same exact
# version so there is ONE maplibre instance (two instances break the worker:
# "Bc is not defined" via _dispatchWorkerUpdate). Bump this when @maptiler/sdk does.
overrides:
  maplibre-gl: 5.21.1
  # deck.gl 9.3 uses luma.gl 9.3. @deck.gl/extensions accepts any @luma.gl/webgl 9.x,
  # so a fresh resolve picks 9.4.x, which needs @luma.gl/core 9.4 and breaks the
  # build ("isHTMLInCanvasSupported" is not exported). Keep webgl on 9.3 until
  # deck.gl moves to luma.gl 9.4, then remove this line.
  "@luma.gl/webgl": ~9.3.3
