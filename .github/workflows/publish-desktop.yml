name: Publish Desktop Releases

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'packages/desktop/src-tauri/tauri.conf.json'

jobs:
  publish-tauri:
    name: Build & Publish Tauri
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JS dependencies
        run: pnpm install

      - name: Parse Version & Strategy
        id: strategy
        shell: bash
        run: |
          cd packages/desktop/src-tauri
          VERSION=$(grep '"version"' tauri.conf.json | head -1 | awk -F '"' '{print $4}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]] || [[ "$VERSION" == *".pre"* ]] || [[ "$VERSION" == *"-pre"* ]]; then
            IS_PRERELEASE="true"
          fi
          
          SHOULD_BUILD="true"
          if [ "${{ github.ref_name }}" = "dev" ]; then
            if [ "$IS_PRERELEASE" = "false" ]; then
              echo "Skipping: Stable versions are not released from the dev branch."
              SHOULD_BUILD="false"
            fi
            echo "config=--config src-tauri/tauri.staging.conf.json" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            # main branch
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "Skipping: Pre-release versions are not released from the main branch."
              SHOULD_BUILD="false"
            fi
            echo "config=" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

      - name: Build Tauri App
        if: steps.strategy.outputs.should_build == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd packages/desktop
          pnpm tauri build ${{ steps.strategy.outputs.config }} --target ${{ matrix.target }}

      - name: Upload to Distribution Repo
        if: steps.strategy.outputs.should_build == 'true'
        env:
          # You MUST generate a Github Personal Access Token (classic) with "repo" scope
          # and add it to your RegenWorks repository secrets as "DIST_REPO_TOKEN"
          GITHUB_TOKEN: ${{ secrets.DIST_REPO_TOKEN }} 
        shell: bash
        run: |
          VERSION="${{ steps.strategy.outputs.version }}"
          TAG="v$VERSION"
          PRERELEASE_FLAG=""
          if [ "${{ steps.strategy.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          
          # Initialize release on distribution repo if it doesn't exist
          gh release view $TAG --repo regen-farmer/regenworks-distribution || gh release create $TAG --repo regen-farmer/regenworks-distribution --title $TAG $PRERELEASE_FLAG --notes "Release $TAG"
          
          cd packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          
          # Upload everything relevant. (bash loops over found files to safely handle globs across OS platforms)
          find . -type f \( -name "*.dmg" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.sig" -o -name "*.exe" \) -exec gh release upload $TAG "{}" --repo regen-farmer/regenworks-distribution --clobber \;
