name: Publish Desktop Releases (Electron)

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'packages/desktop-electron/package.json'
  workflow_dispatch:

jobs:
  # Pre-create the draft release so parallel platform builds don't race
  create-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.version.outputs.should_build }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6

      - name: Parse Version & Strategy
        id: version
        shell: bash
        run: |
          cd packages/desktop-electron
          VERSION=$(grep '"version"' package.json | head -1 | awk -F '"' '{print $4}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          IS_PRERELEASE="false"
          if [[ "$VERSION" == *"-"* ]]; then
            IS_PRERELEASE="true"
          fi

          SHOULD_BUILD="true"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            PREV_VERSION=$(git show HEAD~1:packages/desktop-electron/package.json 2>/dev/null | grep '"version"' | head -1 | awk -F '"' '{print $4}' || echo "")
            if [ "$VERSION" = "$PREV_VERSION" ]; then
              echo "Version unchanged ($VERSION), skipping build."
              SHOULD_BUILD="false"
            fi
          fi
          if [ "${{ github.ref_name }}" = "dev" ]; then
            if [ "$IS_PRERELEASE" = "false" ]; then
              echo "Skipping: Stable versions are not released from the dev branch."
              SHOULD_BUILD="false"
            fi
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "Skipping: Pre-release versions are not released from the main branch."
              SHOULD_BUILD="false"
            fi
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

      - name: Create draft release
        if: steps.version.outputs.should_build == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          REPO="regen-farmer/regenworks-distribution"
          # Create draft release (ignore error if it already exists)
          gh release create "$TAG" --repo "$REPO" --draft --title "$TAG" --notes "" 2>/dev/null || echo "Release $TAG already exists"

  publish-electron:
    name: Build & Publish Electron
    needs: create-release
    if: needs.create-release.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            target: aarch64-apple-darwin
          - platform: macos-26-intel
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            vcpkg_triplet: x64-windows
            electron_arch: x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            vcpkg_triplet: arm64-windows
            electron_arch: arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/gis-napi -> target

      - name: Cache vcpkg packages
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v5.0.5
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ matrix.vcpkg_triplet }}-geos

      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        run: brew install geos

      - name: Import Developer ID certificate (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MAC_CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Put our keychain ahead of the default search list so codesign finds the identity
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev

      - name: Install Windows dependencies
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $triplet = "${{ matrix.vcpkg_triplet }}"
          vcpkg install "geos:$triplet"
          vcpkg install "pkgconf:x64-windows"

          $geosVersion = (vcpkg list geos) | Where-Object { $_ -match "geos:$triplet" } | ForEach-Object { ($_ -split "\s+")[1] }
          echo "GEOS_VERSION=$geosVersion" >> $env:GITHUB_ENV

          echo "GEOS_LIB_DIR=C:\vcpkg\installed\$triplet\lib" >> $env:GITHUB_ENV
          echo "GEOS_INCLUDE_DIR=C:\vcpkg\installed\$triplet\include" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\$triplet\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "C:\vcpkg\installed\$triplet\bin" >> $env:GITHUB_PATH
          echo "C:\vcpkg\installed\x64-windows\tools\pkgconf" >> $env:GITHUB_PATH
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install JS dependencies
        run: pnpm install

      - name: Build gis-napi native addon
        shell: bash
        run: |
          cd packages/gis-napi
          # Cross-compile when target differs from host
          if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then
            pnpm napi build --platform --release --target aarch64-pc-windows-msvc
          else
            pnpm run build
          fi
          # Copy platform GEOS shared libraries into the package so they get bundled
          if [ "${{ runner.os }}" = "Windows" ]; then
            TRIPLET="${{ matrix.vcpkg_triplet }}"
            cp "C:/vcpkg/installed/$TRIPLET/bin/geos.dll" .
            cp "C:/vcpkg/installed/$TRIPLET/bin/geos_c.dll" .
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp /usr/lib/x86_64-linux-gnu/libgeos.so* . 2>/dev/null || cp /usr/lib/libgeos.so* . 2>/dev/null || true
            cp /usr/lib/x86_64-linux-gnu/libgeos_c.so* . 2>/dev/null || cp /usr/lib/libgeos_c.so* . 2>/dev/null || true
          fi

      - name: Build frontend SPA
        env:
          # dev branch → dev backend on Render; main branch → prod backend on Render.
          VITE_BACKEND_URL: ${{ github.ref_name == 'main' && 'https://regenworks-prod-backend.onrender.com' || 'https://regenworks-dev-backend.onrender.com' }}
        run: pnpm --filter @rw/desktop-electron build:frontend

      - name: Build & Publish Electron App
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEBUG: electron-builder,electron-notarize*
        shell: bash
        run: |
          cd packages/desktop-electron
          ARCH_FLAG=""
          if [ -n "${{ matrix.electron_arch }}" ]; then
            ARCH_FLAG="--${{ matrix.electron_arch }}"
          fi

          CONFIG_FLAG=""
          if [ "${{ needs.create-release.outputs.prerelease }}" = "true" ]; then
            CONFIG_FLAG="--config electron-builder.staging.yml"
          fi

          pnpm build

          # electron-builder creates a draft release, uploads artifacts + latest*.yml.
          # Retry on transient Apple notarytool network errors (seen as
          # NSURLErrorDomain -1009 mid-submission). Three attempts with backoff.
          for attempt in 1 2 3; do
            if pnpm exec electron-builder $CONFIG_FLAG --publish always $ARCH_FLAG; then
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "electron-builder failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 30))
          done

          # Upload a per-target copy of latest*.yml so the publish job can merge them
          VERSION="${{ needs.create-release.outputs.version }}"
          TAG="v$VERSION"
          cd dist-electron
          for yml in latest*.yml; do
            [ -f "$yml" ] || continue
            BASE="${yml%.yml}"
            cp "$yml" "${BASE}-${{ matrix.target }}.yml"
            gh release upload $TAG "${BASE}-${{ matrix.target }}.yml" --repo regen-farmer/regenworks-distribution --clobber
          done

  # Publish the draft release after all platform builds succeed
  publish-release:
    name: Publish Release
    needs: [create-release, publish-electron]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Merge latest*.yml and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        shell: bash
        run: |
          VERSION=$(grep '"version"' packages/desktop-electron/package.json | head -1 | awk -F '"' '{print $4}')
          TAG="v$VERSION"
          REPO="regen-farmer/regenworks-distribution"
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"

          # Download all yml files from the release (per-target + electron-builder originals)
          gh release download $TAG --repo $REPO --pattern "*.yml" --dir . 2>/dev/null || true
          echo "Downloaded yml files:"
          ls -la *.yml 2>/dev/null || echo "  (none)"

          # Merge function: combine file entries from per-target ymls into one
          merge_ymls() {
            local OUTPUT="$1"
            local PREFIX="$2"
            shift 2
            local TARGETS=("$@")

            echo "version: $VERSION" > "$OUTPUT"
            echo "files:" >> "$OUTPUT"
            local FIRST_PATH="" FIRST_SHA=""

            for target in "${TARGETS[@]}"; do
              local SRC="${PREFIX}-${target}.yml"
              [ -f "$SRC" ] || continue
              echo "  Merging $SRC into $OUTPUT"
              # Extract file entries (lines starting with "  - url:" and following indented lines)
              awk '/^  - url:/{found=1} found && /^  [^ ]/{print} found && /^    /{print} found && /^[^ ]/{found=0}' "$SRC" >> "$OUTPUT"
              # Grab first path/sha for top-level fields
              if [ -z "$FIRST_PATH" ]; then
                FIRST_PATH=$(awk '/^path:/{print $2}' "$SRC")
                FIRST_SHA=$(awk '/^sha512:/{print $2}' "$SRC")
              fi
            done

            echo "path: $FIRST_PATH" >> "$OUTPUT"
            echo "sha512: $FIRST_SHA" >> "$OUTPUT"
            echo "releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'" >> "$OUTPUT"
          }

          # Merge macOS (arm64 + x64)
          merge_ymls "latest-mac.yml" "latest-mac" \
            "aarch64-apple-darwin" "x86_64-apple-darwin"

          # Merge Windows (arm64 + x64)
          merge_ymls "latest.yml" "latest" \
            "x86_64-pc-windows-msvc" "aarch64-pc-windows-msvc"

          # Linux (single arch, just copy)
          if [ -f "latest-linux-x86_64-unknown-linux-gnu.yml" ]; then
            cp "latest-linux-x86_64-unknown-linux-gnu.yml" "latest-linux.yml"
          fi

          echo "=== latest-mac.yml ==="
          cat latest-mac.yml
          echo "=== latest.yml ==="
          cat latest.yml
          echo "=== latest-linux.yml ==="
          cat latest-linux.yml

          # Upload merged yml files and publish
          gh release upload $TAG latest-mac.yml latest.yml latest-linux.yml --repo $REPO --clobber

          # Clean up per-target yml files from the release
          for f in latest-*-*-*.yml; do
            [ -f "$f" ] && gh release delete-asset $TAG "$(basename "$f")" --repo $REPO --yes 2>/dev/null || true
          done

          gh release edit $TAG --repo $REPO --draft=false --title "$TAG"
          echo "Published release $TAG"
