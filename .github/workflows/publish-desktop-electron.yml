name: Publish Desktop Releases (Electron)

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'packages/desktop-electron/package.json'
  workflow_dispatch:

jobs:
  publish-electron:
    name: Build & Publish Electron
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            target: aarch64-apple-darwin
          - platform: macos-26-intel
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            vcpkg_triplet: x64-windows
            electron_arch: x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            vcpkg_triplet: arm64-windows
            electron_arch: arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/gis-napi -> target

      - name: Cache vcpkg packages
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ matrix.vcpkg_triplet }}-geos

      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        run: brew install geos

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev

      - name: Install Windows dependencies
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $triplet = "${{ matrix.vcpkg_triplet }}"
          vcpkg install "geos:$triplet"
          vcpkg install "pkgconf:x64-windows"

          $geosVersion = (vcpkg list geos) | Where-Object { $_ -match "geos:$triplet" } | ForEach-Object { ($_ -split "\s+")[1] }
          echo "GEOS_VERSION=$geosVersion" >> $env:GITHUB_ENV

          echo "GEOS_LIB_DIR=C:\vcpkg\installed\$triplet\lib" >> $env:GITHUB_ENV
          echo "GEOS_INCLUDE_DIR=C:\vcpkg\installed\$triplet\include" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\$triplet\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "C:\vcpkg\installed\$triplet\bin" >> $env:GITHUB_PATH
          echo "C:\vcpkg\installed\x64-windows\tools\pkgconf" >> $env:GITHUB_PATH
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install JS dependencies
        run: pnpm install

      - name: Parse Version & Strategy
        id: strategy
        shell: bash
        run: |
          cd packages/desktop-electron
          VERSION=$(grep '"version"' package.json | head -1 | awk -F '"' '{print $4}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          IS_PRERELEASE="false"
          if [[ "$VERSION" == *"-"* ]]; then
            IS_PRERELEASE="true"
          fi

          SHOULD_BUILD="true"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            PREV_VERSION=$(git show HEAD~1:packages/desktop-electron/package.json 2>/dev/null | grep '"version"' | head -1 | awk -F '"' '{print $4}' || echo "")
            if [ "$VERSION" = "$PREV_VERSION" ]; then
              echo "Version unchanged ($VERSION), skipping build."
              SHOULD_BUILD="false"
            fi
          fi
          if [ "${{ github.ref_name }}" = "dev" ]; then
            if [ "$IS_PRERELEASE" = "false" ]; then
              echo "Skipping: Stable versions are not released from the dev branch."
              SHOULD_BUILD="false"
            fi
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "Skipping: Pre-release versions are not released from the main branch."
              SHOULD_BUILD="false"
            fi
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

      - name: Build gis-napi native addon
        if: steps.strategy.outputs.should_build == 'true'
        shell: bash
        run: |
          cd packages/gis-napi
          # Cross-compile when target differs from host
          if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then
            pnpm napi build --platform --release --target aarch64-pc-windows-msvc
          else
            pnpm run build
          fi
          # Copy platform GEOS shared libraries into the package so they get bundled
          if [ "${{ runner.os }}" = "Windows" ]; then
            TRIPLET="${{ matrix.vcpkg_triplet }}"
            cp "C:/vcpkg/installed/$TRIPLET/bin/geos.dll" .
            cp "C:/vcpkg/installed/$TRIPLET/bin/geos_c.dll" .
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp /usr/lib/x86_64-linux-gnu/libgeos.so* . 2>/dev/null || cp /usr/lib/libgeos.so* . 2>/dev/null || true
            cp /usr/lib/x86_64-linux-gnu/libgeos_c.so* . 2>/dev/null || cp /usr/lib/libgeos_c.so* . 2>/dev/null || true
          fi

      - name: Build isomorphic frontend
        if: steps.strategy.outputs.should_build == 'true'
        env:
          ELECTRON_BUILD: "1"
        run: pnpm --filter isomorphic build

      - name: Build & Publish Electron App
        if: steps.strategy.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        shell: bash
        run: |
          cd packages/desktop-electron
          ARCH_FLAG=""
          if [ -n "${{ matrix.electron_arch }}" ]; then
            ARCH_FLAG="--${{ matrix.electron_arch }}"
          fi
          # electron-builder creates a draft release, uploads artifacts + latest*.yml
          if [ "${{ steps.strategy.outputs.prerelease }}" = "true" ]; then
            pnpm build && pnpm exec electron-builder --config electron-builder.staging.yml --publish always $ARCH_FLAG
          else
            pnpm build && pnpm exec electron-builder --publish always $ARCH_FLAG
          fi

          # Upload a per-target copy of latest*.yml so the publish job can merge them
          VERSION="${{ steps.strategy.outputs.version }}"
          TAG="v$VERSION"
          cd dist-electron
          for yml in latest*.yml; do
            [ -f "$yml" ] || continue
            BASE="${yml%.yml}"
            cp "$yml" "${BASE}-${{ matrix.target }}.yml"
            gh release upload $TAG "${BASE}-${{ matrix.target }}.yml" --repo regen-farmer/regenworks-distribution --clobber
          done

  # Publish the draft release after all platform builds succeed
  publish-release:
    name: Publish Release
    needs: publish-electron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge latest*.yml and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        shell: bash
        run: |
          VERSION=$(grep '"version"' packages/desktop-electron/package.json | head -1 | awk -F '"' '{print $4}')
          TAG="v$VERSION"
          REPO="regen-farmer/regenworks-distribution"
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"

          # Download all yml files from the release (per-target + electron-builder originals)
          gh release download $TAG --repo $REPO --pattern "*.yml" --dir . 2>/dev/null || true
          echo "Downloaded yml files:"
          ls -la *.yml 2>/dev/null || echo "  (none)"

          # Merge function: combine file entries from per-target ymls into one
          merge_ymls() {
            local OUTPUT="$1"
            local PREFIX="$2"
            shift 2
            local TARGETS=("$@")

            echo "version: $VERSION" > "$OUTPUT"
            echo "files:" >> "$OUTPUT"
            local FIRST_PATH="" FIRST_SHA=""

            for target in "${TARGETS[@]}"; do
              local SRC="${PREFIX}-${target}.yml"
              [ -f "$SRC" ] || continue
              echo "  Merging $SRC into $OUTPUT"
              # Extract file entries (lines starting with "  - url:" and following indented lines)
              awk '/^  - url:/{found=1} found && /^  [^ ]/{print} found && /^    /{print} found && /^[^ ]/{found=0}' "$SRC" >> "$OUTPUT"
              # Grab first path/sha for top-level fields
              if [ -z "$FIRST_PATH" ]; then
                FIRST_PATH=$(awk '/^path:/{print $2}' "$SRC")
                FIRST_SHA=$(awk '/^sha512:/{print $2}' "$SRC")
              fi
            done

            echo "path: $FIRST_PATH" >> "$OUTPUT"
            echo "sha512: $FIRST_SHA" >> "$OUTPUT"
            echo "releaseDate: '$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'" >> "$OUTPUT"
          }

          # Merge macOS (arm64 + x64)
          merge_ymls "latest-mac.yml" "latest-mac" \
            "aarch64-apple-darwin" "x86_64-apple-darwin"

          # Merge Windows (arm64 + x64)
          merge_ymls "latest.yml" "latest" \
            "x86_64-pc-windows-msvc" "aarch64-pc-windows-msvc"

          # Linux (single arch, just copy)
          if [ -f "latest-linux-x86_64-unknown-linux-gnu.yml" ]; then
            cp "latest-linux-x86_64-unknown-linux-gnu.yml" "latest-linux.yml"
          fi

          echo "=== latest-mac.yml ==="
          cat latest-mac.yml
          echo "=== latest.yml ==="
          cat latest.yml
          echo "=== latest-linux.yml ==="
          cat latest-linux.yml

          # Upload merged yml files and publish
          gh release upload $TAG latest-mac.yml latest.yml latest-linux.yml --repo $REPO --clobber

          # Clean up per-target yml files from the release
          for f in latest-*-*-*.yml; do
            [ -f "$f" ] && gh release delete-asset $TAG "$(basename "$f")" --repo $REPO --yes 2>/dev/null || true
          done

          gh release edit $TAG --repo $REPO --draft=false --title "$TAG"
          echo "Published release $TAG"
