name: Publish Desktop Releases (Electron)

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'packages/desktop-electron/package.json'
  workflow_dispatch:

jobs:
  publish-electron:
    name: Build & Publish Electron
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            target: aarch64-apple-darwin
          - platform: macos-26-intel
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/gis-napi -> target

      - name: Cache vcpkg packages
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-geos

      - name: Install macOS dependencies
        if: startsWith(matrix.platform, 'macos')
        run: brew install geos

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev

      - name: Install Windows dependencies
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          vcpkg install geos:x64-windows
          vcpkg install pkgconf:x64-windows

          $geosVersion = (vcpkg list geos) | Where-Object { $_ -match "geos:x64-windows" } | ForEach-Object { ($_ -split "\s+")[1] }
          echo "GEOS_VERSION=$geosVersion" >> $env:GITHUB_ENV

          echo "GEOS_LIB_DIR=C:\vcpkg\installed\x64-windows\lib" >> $env:GITHUB_ENV
          echo "GEOS_INCLUDE_DIR=C:\vcpkg\installed\x64-windows\include" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:\vcpkg\installed\x64-windows\lib\pkgconfig" >> $env:GITHUB_ENV
          echo "C:\vcpkg\installed\x64-windows\bin" >> $env:GITHUB_PATH
          echo "C:\vcpkg\installed\x64-windows\tools\pkgconf" >> $env:GITHUB_PATH
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Install JS dependencies
        run: pnpm install

      - name: Parse Version & Strategy
        id: strategy
        shell: bash
        run: |
          cd packages/desktop-electron
          VERSION=$(grep '"version"' package.json | head -1 | awk -F '"' '{print $4}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          IS_PRERELEASE="false"
          STAGE_LABEL=""
          if [[ "$VERSION" == *"-"* ]]; then
            IS_PRERELEASE="true"
            PRE_NUM=$(echo "$VERSION" | grep -oE '\-[0-9]+$' | tr -d '-')
            [[ -n "$PRE_NUM" ]] && STAGE_LABEL="pre.$((10#$PRE_NUM))"
          fi
          echo "stage_label=$STAGE_LABEL" >> $GITHUB_OUTPUT

          SHOULD_BUILD="true"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            PREV_VERSION=$(git show HEAD~1:packages/desktop-electron/package.json 2>/dev/null | grep '"version"' | head -1 | awk -F '"' '{print $4}' || echo "")
            if [ "$VERSION" = "$PREV_VERSION" ]; then
              echo "Version unchanged ($VERSION), skipping build."
              SHOULD_BUILD="false"
            fi
          fi
          if [ "${{ github.ref_name }}" = "dev" ]; then
            if [ "$IS_PRERELEASE" = "false" ]; then
              echo "Skipping: Stable versions are not released from the dev branch."
              SHOULD_BUILD="false"
            fi
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "Skipping: Pre-release versions are not released from the main branch."
              SHOULD_BUILD="false"
            fi
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

      - name: Build gis-napi native addon
        if: steps.strategy.outputs.should_build == 'true'
        shell: bash
        run: |
          cd packages/gis-napi
          pnpm run build

      - name: Build isomorphic frontend
        if: steps.strategy.outputs.should_build == 'true'
        env:
          ELECTRON_BUILD: "1"
        run: pnpm --filter isomorphic build

      - name: Build & Package Electron App
        id: build
        if: steps.strategy.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        shell: bash
        run: |
          cd packages/desktop-electron
          if [ "${{ steps.strategy.outputs.prerelease }}" = "true" ]; then
            pnpm run package:staging
          else
            pnpm run package
          fi

      - name: Upload to Distribution Repo
        if: steps.strategy.outputs.should_build == 'true' && steps.build.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.strategy.outputs.version }}"
          TAG="v$VERSION"
          PRERELEASE_FLAG=""
          if [ "${{ steps.strategy.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          STAGE_LABEL="${{ steps.strategy.outputs.stage_label }}"
          RELEASE_TITLE="$TAG${STAGE_LABEL:+ ($STAGE_LABEL)}"
          gh release view $TAG --repo regen-farmer/regenworks-distribution || gh release create $TAG --repo regen-farmer/regenworks-distribution --title "$RELEASE_TITLE" $PRERELEASE_FLAG --notes "Release $TAG"

          cd packages/desktop-electron/dist-electron

          case "${{ matrix.platform }}" in
            macos-26)        PLATFORM_LABEL="macos_arm64" ;;
            macos-26-intel)  PLATFORM_LABEL="macos_x86_64" ;;
            windows-latest)  PLATFORM_LABEL="windows_x86_64" ;;
            ubuntu-22.04)    PLATFORM_LABEL="linux_x86_64" ;;
            *)               PLATFORM_LABEL="${{ matrix.platform }}" ;;
          esac

          TARGET_BASE="RegenWorks_${VERSION}_${PLATFORM_LABEL}"

          # Remove NSIS uninstaller stub so it doesn't collide with the real installer
          find . -name "__uninstaller-*" -delete

          for ext in dmg AppImage deb rpm exe; do
            find . -name "*.$ext" ! -name "*.blockmap" -print0 | while IFS= read -r -d '' f; do
              mv "$f" "$(dirname "$f")/${TARGET_BASE}.$ext"
            done
          done

          find . -type f \( \
            -name "*.dmg" \
            -o -name "*.AppImage" \
            -o -name "*.deb" \
            -o -name "*.rpm" \
            -o -name "*.exe" \
            -o -name "*.blockmap" \
            -o -name "latest*.yml" \
          \) -exec gh release upload $TAG "{}" --repo regen-farmer/regenworks-distribution --clobber \;
