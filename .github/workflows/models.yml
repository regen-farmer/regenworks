name: Model runners

# Only runs when something under models/ changes, so it never slows down or
# blocks the app's own CI.
on:
  pull_request:
    branches: [dev]
    paths: ["models/**", ".github/workflows/models.yml"]
  push:
    branches: [dev]
    paths: ["models/**", ".github/workflows/models.yml"]
  workflow_dispatch:

concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with ARG SHAMBA_COMMIT in models/shamba/Dockerfile.
  SHAMBA_COMMIT: c98f5ef07c43c2841ef7e025f92ff52901f18c72
  # Example weather for the DynACof golden test (VEZY/DynACof.jl_inputs).
  DYNACOF_INPUTS_COMMIT: bce4d64f2d955b645ab06d355b2a34cfdab738c2
  # Keep in step with ARG CAF2021_COMMIT in models/caf2021/Dockerfile.
  CAF2021_COMMIT: e752e2024c420cb1f4518fcfc29010fa65670afd

jobs:
  shamba-tests:
    name: SHAMBA wrapper tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: models/shamba
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Fetch pinned SHAMBA
        run: |
          git init /tmp/shamba && cd /tmp/shamba
          git remote add origin https://github.com/shamba-model/shamba
          git fetch --depth 1 origin "$SHAMBA_COMMIT"
          git checkout --detach FETCH_HEAD

      - name: Check the Dockerfile pins the same commit
        run: grep -q "ARG SHAMBA_COMMIT=$SHAMBA_COMMIT" Dockerfile

      - run: pip install -r requirements-test.txt

      - name: Schema files are current
        run: python -m adapter.export_schema --check

      - name: Golden and contract tests
        env:
          SHAMBA_SRC: /tmp/shamba/shamba
        run: python -m pytest -q tests

  shamba-image:
    name: SHAMBA image builds and answers
    runs-on: ubuntu-latest
    needs: shamba-tests
    steps:
      - uses: actions/checkout@v7

      # Built locally only, never pushed (see the licence note in the Dockerfile).
      - name: Build
        run: docker build -t shamba-runner:ci models/shamba

      - name: Smoke test
        run: |
          docker run -d --name shamba -p 8080:8080 -e SHAMBA_API_TOKEN=ci --read-only --tmpfs /tmp shamba-runner:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf -H "Authorization: Bearer ci" localhost:8080/processes/shamba | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['id']=='shamba'; print(d['upstream'])"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/processes)" = "401"

      - name: Logs
        if: always()
        run: docker logs shamba || true

  dynacof-tests:
    name: DynACof wrapper tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: models/dynacof
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10.4"

      - uses: julia-actions/cache@v2

      - name: Install pinned Julia packages
        run: julia --project=worker -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Fetch example weather
        run: |
          git init /tmp/dynacof-inputs && cd /tmp/dynacof-inputs
          git remote add origin https://github.com/VEZY/DynACof.jl_inputs
          git fetch --depth 1 origin "$DYNACOF_INPUTS_COMMIT"
          git checkout --detach FETCH_HEAD

      - run: pip install -r requirements-test.txt

      - name: Schema files are current
        run: python -m adapter.export_schema --check

      - name: Golden and contract tests
        env:
          DYNACOF_INPUTS: /tmp/dynacof-inputs
        run: python -m pytest -q tests

  dynacof-image:
    name: DynACof image builds and answers
    runs-on: ubuntu-latest
    needs: dynacof-tests
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t dynacof-runner:ci models/dynacof

      - name: Smoke test
        run: |
          docker run -d --name dynacof -p 8080:8080 -e DYNACOF_API_TOKEN=ci --read-only --tmpfs /tmp dynacof-runner:ci
          for i in $(seq 1 300); do
            s=$(curl -sf localhost:8080/health | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])" || true)
            [ "$s" = "ok" ] && break; sleep 2
          done
          test "$s" = "ok"
          curl -sf -H "Authorization: Bearer ci" localhost:8080/processes/dynacof | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['id']=='dynacof'; print(d['upstream'])"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/processes)" = "401"

      - name: Logs
        if: always()
        run: docker logs dynacof || true

  caf2021-tests:
    name: CAF2021 wrapper tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: models/caf2021
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check the Dockerfile pins the same commit
        run: grep -q "ARG CAF2021_COMMIT=$CAF2021_COMMIT" Dockerfile

      - name: Fetch and compile pinned CAF2021
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gfortran
          git init /tmp/caf2021 && cd /tmp/caf2021
          git remote add origin https://github.com/MarcelVanOijen/CAF2021
          git fetch --depth 1 origin "$CAF2021_COMMIT"
          git checkout --detach FETCH_HEAD
          cd model
          gfortran -O3 -fPIC -fdefault-real-8 -c declare_parameters.f90 environment.f90 abovegroundres.f90 \
            management.f90 tree.f90 shade.f90 scaling.f90 coffee.f90 belowgroundres.f90 soil.f90 set_params.f90 CAF2021.f90
          gfortran -shared -o /tmp/libcaf2021.so *.o

      - run: pip install -r requirements-test.txt

      - name: Schema files are current
        run: python -m adapter.export_schema --check

      - name: Golden and contract tests
        env:
          CAF2021_SRC: /tmp/caf2021
          CAF2021_LIB: /tmp/libcaf2021.so
        run: python -m pytest -q tests

  caf2021-image:
    name: CAF2021 image builds and answers
    runs-on: ubuntu-latest
    needs: caf2021-tests
    steps:
      - uses: actions/checkout@v7

      # Built locally only, never pushed (no licence file upstream; research use).
      - name: Build
        run: docker build -t caf2021-runner:ci models/caf2021

      - name: Smoke test
        run: |
          docker run -d --name caf2021 -p 8080:8080 -e CAF2021_API_TOKEN=ci --read-only --tmpfs /tmp caf2021-runner:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf -H "Authorization: Bearer ci" localhost:8080/processes/caf2021 | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['id']=='caf2021' and len(d['outputVariables'])==172; print(d['upstream']['commit'])"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/processes)" = "401"

      - name: Logs
        if: always()
        run: docker logs caf2021 || true

  yieldsafe-tests:
    name: Yield-SAFE port and wrapper tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: models/yieldsafe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements-test.txt

      - name: Schema files are current
        run: python -m adapter.export_schema --check

      # The fixture holds the workbook's inputs and Excel's cached results, so no
      # download is needed (tools/from_workbook.py checks all columns locally).
      - name: Golden and contract tests
        run: python -m pytest -q tests

  yieldsafe-image:
    name: Yield-SAFE image builds and answers
    runs-on: ubuntu-latest
    needs: yieldsafe-tests
    steps:
      - uses: actions/checkout@v7

      # Built locally only, never pushed (research use; see models/yieldsafe/NOTICE.md).
      - name: Build
        run: docker build -t yieldsafe-runner:ci models/yieldsafe

      - name: Smoke test
        run: |
          docker run -d --name yieldsafe -p 8080:8080 -e YIELDSAFE_API_TOKEN=ci --read-only --tmpfs /tmp yieldsafe-runner:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf -H "Authorization: Bearer ci" localhost:8080/processes/yieldsafe | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['id']=='yieldsafe' and 'poplar_upson_agf' in d['templates']['trees']; print(d['upstream']['referenceWorkbookSha256'])"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/processes)" = "401"

      - name: Logs
        if: always()
        run: docker logs yieldsafe || true
