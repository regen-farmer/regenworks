name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter isomorphic lint

      - name: Build (web)
        run: pnpm --filter isomorphic build

  e2e:
    name: End-to-end tests
    needs: static
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_AUTH0_ID: ${{ secrets.AUTH_AUTH0_ID }}
      AUTH_AUTH0_SECRET: ${{ secrets.AUTH_AUTH0_SECRET }}
      AUTH_AUTH0_ISSUER: ${{ secrets.AUTH_AUTH0_ISSUER }}
      # /api/auth path is required by Auth.js for action routing and the callback.
      AUTH_URL: http://localhost:10000/api/auth
      VITE_BACKEND_URL: https://regenworks-dev-backend.onrender.com
      VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
      VITE_GEOCODER_API_KEY: ${{ secrets.VITE_GEOCODER_API_KEY }}
      VITE_STRIPE_MODE: ${{ secrets.VITE_STRIPE_MODE }}
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
      E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove stale Microsoft apt sources
        run: |
          sudo grep -rl "packages.microsoft.com" /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f

      - name: Install Playwright browser
        run: pnpm --filter isomorphic exec playwright install --with-deps chromium

      - name: Build (web)
        run: pnpm --filter isomorphic build:e2e

      - name: Run E2E tests
        run: |
          if [ -n "$E2E_TEST_USER_EMAIL" ]; then
            pnpm --filter isomorphic test:e2e
          else
            echo "No E2E test user configured; running smoke project only."
            pnpm --filter isomorphic test:e2e --project=smoke
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/isomorphic/playwright-report/
          retention-days: 7

  backend:
    name: Backend build & boot
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter backend build

      # Boot the built server against a throwaway Mongo to catch startup crashes
      # (e.g. an Express 5 route that only fails at runtime, not at build).
      - name: Boot backend (startup smoke)
        env:
          DATABASEURL: mongodb://localhost:27017/ci
          BACKEND_IP: 127.0.0.1
          BACKEND_PORT: 3001
          # Dummy keys so startup-time constructors (Resend/Stripe/geocoder) don't throw.
          RESEND_API_KEY: re_dummy
          STRIPE_SECRET_KEY: dummy
          GEOCODER_API_KEY: dummy
        run: |
          node packages/backend/build/app.js > /tmp/backend.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "Backend crashed on startup:"; cat /tmp/backend.log; exit 1
            fi
            if grep -q "has started on" /tmp/backend.log; then
              echo "Backend booted OK:"; cat /tmp/backend.log; kill "$PID"; exit 0
            fi
            sleep 1
          done
          echo "Backend did not start within 30s:"; cat /tmp/backend.log; kill "$PID" 2>/dev/null; exit 1
