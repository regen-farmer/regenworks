version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      # TanStack Router and Start must move together. Bumping one alone
      # installs two router versions side by side and the app renders blank.
      tanstack-router:
        patterns:
          - "@tanstack/solid-router"
          - "@tanstack/solid-start"
          - "@tanstack/router-plugin"
          - "@tanstack/router-*"
          - "@tanstack/start-*"
      # deck.gl packages share shader code with each other and with luma.gl.
      # Mixed versions break the 3D map ("DECKGL_FILTER_COLOR: no matching
      # overloaded function"), so they always update together.
      deckgl:
        patterns:
          - "@deck.gl/*"
          - "@luma.gl/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
