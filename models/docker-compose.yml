# Model runners for local development. Separate from the app's
# docker-compose.yml on purpose, so the two can change independently.
#
#   docker compose -f models/docker-compose.yml up --build
#   curl -s -H "Authorization: Bearer local-dev-token" localhost:8090/processes/shamba | head   (SHAMBA)
#   curl -s -H "Authorization: Bearer local-dev-token" localhost:8091/processes/dynacof | head  (DynACof)
#
# The models never call out (weather and soil travel in the request). Docker
# can't publish a port from a fully internal network, so outbound blocking is
# left to the hosting platform; locally the port is bound to 127.0.0.1 only.

services:
  shamba:
    build:
      context: ./shamba
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      SHAMBA_API_TOKEN: ${SHAMBA_API_TOKEN:-local-dev-token}
      SHAMBA_MAX_CONCURRENT: "2"
      SHAMBA_TIMEOUT_S: "120"
      SHAMBA_MEMORY_MB: "1024"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    cpus: 2

  dynacof:
    build:
      context: ./dynacof
    ports:
      - "127.0.0.1:8091:8080"
    environment:
      DYNACOF_API_TOKEN: ${DYNACOF_API_TOKEN:-local-dev-token}
      DYNACOF_MAX_CONCURRENT: "1"
      DYNACOF_TIMEOUT_S: "180"
      DYNACOF_MEMORY_MB: "2048"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    cpus: 2
